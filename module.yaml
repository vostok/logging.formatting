notests *default:
  build:
    target: Vostok.Logging.Formatting.sln
    configuration: NoTests
    tool:
      name: dotnet

  install:
    - Vostok.Logging.Formatting/bin/Release/netstandard2.0/Vostok.Logging.Formatting.dll
    - module vostok.logging.abstractions
    - groups:
        - target-framework: "netstandard2.0"
          libraries:
            - Vostok.Logging.Formatting/bin/Release/netstandard2.0/Vostok.Logging.Formatting.dll
          modules:
            - name: vostok.logging.abstractions
        - target-framework: "net6.0"
          libraries:
            - Vostok.Logging.Formatting/bin/Release/net6.0/Vostok.Logging.Formatting.dll
          modules:
            - name: vostok.logging.abstractions
        - target-framework: "net8.0"
          libraries:
            - Vostok.Logging.Formatting/bin/Release/net8.0/Vostok.Logging.Formatting.dll
          modules:
            - name: vostok.logging.abstractions

  deps:
    - vostok.devtools
    - vostok.logging.abstractions
    - vostok.commons.collections/src
    - vostok.commons.formatting/src

full-build > notests:
  install:
    - Vostok.Logging.Formatting/bin/Release/netstandard2.0/Vostok.Logging.Formatting.dll
    - module vostok.logging.abstractions
    - groups:
        - target-framework: "netstandard2.0"
          libraries:
            - Vostok.Logging.Formatting/bin/Release/netstandard2.0/Vostok.Logging.Formatting.dll
          modules:
            - name: vostok.logging.abstractions
        - target-framework: "net6.0"
          libraries:
            - Vostok.Logging.Formatting/bin/Release/net6.0/Vostok.Logging.Formatting.dll
          modules:
            - name: vostok.logging.abstractions
        - target-framework: "net8.0"
          libraries:
            - Vostok.Logging.Formatting/bin/Release/net8.0/Vostok.Logging.Formatting.dll
          modules:
            - name: vostok.logging.abstractions

  deps:
    - -vostok.devtools
    - vostok.devtools@with-net6.0

  build:
    target: Vostok.Logging.Formatting.sln
    configuration: Release